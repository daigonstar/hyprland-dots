# Category: Default programs
$mainMod = SUPER
$terminal = ghostty
$fileManager = thunar
$menu = ~/.config/rofi/launchers/categorized/launcher.sh
$wall = ~/.config/rofi/wallpaper/wallpaper.sh
$browser = zen-browser
$store = flatpak run io.github.kolunmi.Bazaar
$chat = discord


# Category: Application Launchers

bind = $mainMod, T, exec, $terminal # Opens Terminal
bind = $mainMod, A, exec, $store # Opens store
bind = $mainMod, Q, killactive, # Kills current window
bind = $mainMod, B, exec, $browser # Open Web browser
bind = $mainMod SHIFT, S, exec, uuctl # Open uuctl
bind = $mainMod SHIFT, R, exec, hyprctl reload # Reload Hyprland
#bind = $mainMod, C, exec, $chat # Open Discord
bind = $mainMod, W, exec, $wall # Open Wallpaper selector
bind = $mainMod SHIFT, T, exec, twingate start # Start twingate
bind = $mainMod, O, exec, flatpak run md.obsidian.Obsidian # Open Obsidian
#bind = $mainMod, M, exit, # Logout
bind = $mainMod, E, exec, $fileManager # Open Files
bind = $mainMod, V, togglefloating # Toggle floating window
bind = $mainMod, SPACE, exec, $menu # Open Launchers
bind = $mainMod, P, pseudo, # Toggle pseudotiling (dwindle)
bind = $mainMod, J, layoutmsg, togglesplit # Toggle split direction (dwindle)
bind = $mainMod, Z, exec, zeditor # Open Zed
# Category: Tools

bind = ALT, Tab, exec, hypr-alttab # Alt-tab window switcher
bind = $mainMod, L, exec, loginctl lock-session #Lock screen
bind = $mainMod, N, exec, ~/.config/hypr/scripts/restart.sh all #Restart Waybar + swaync
bind = $mainMod SHIFT, N, exec, ~/.config/hypr/scripts/restart.sh waybar #Restart Waybar
bind = $mainMod, END, exit, # Exit Hyprland session
bind = $mainMod SHIFT, G, exec, ~/.config/hypr/scripts/gamemode.sh # Toggle gamemode
bind = $mainMod CTRL, O, exec, ~/.config/hypr/scripts/ollama.sh # Start Ollama
bind = $mainMod SHIFT, O, exec, ~/.config/hypr/scripts/stop_ollama.sh # Stop Ollama
bind = $mainMod SHIFT, C, exec, clipvault list | rofi -dmenu -display-columns 2 | clipvault get | wl-copy # Open clipboard history
bind = SUPER, F12, exec, hyprctl dispatch focusmonitor DP-1 # Focus monitor DP-1

# Category: Screenshot
bind = CONTROL ALT, S, exec, hyprshot -m window -o ~/Pictures/screenshots # Screenshot active window
bind = CONTROL SHIFT, S, exec, hyprshot -m region -o ~/Pictures/screenshots # Screenshot selected region

# Category: Move focus
bind = $mainMod, left, movefocus, l # Focus window to the left
bind = $mainMod, right, movefocus, r # Focus window to the right
bind = $mainMod, up, movefocus, u # Focus window above
bind = $mainMod, down, movefocus, d # Focus window below

# Category: Resize windows
binde = $mainMod SHIFT, left, resizeactive,-50 0 # Shrink window width
binde = $mainMod SHIFT, right, resizeactive,50 0 # Grow window width
binde = $mainMod SHIFT, up, resizeactive,0 -50 # Shrink window height
binde = $mainMod SHIFT, down, resizeactive,0 50 # Grow window height

# Category: Switch workspaces
bind = $mainMod, 1, workspace, 1 # Switch to workspace 1
bind = $mainMod, 2, workspace, 2 # Switch to workspace 2
bind = $mainMod, 3, workspace, 3 # Switch to workspace 3
bind = $mainMod, 4, workspace, 4 # Switch to workspace 4
bind = $mainMod, 5, workspace, 5 # Switch to workspace 5
bind = $mainMod, 6, workspace, 6 # Switch to workspace 6
bind = $mainMod, 7, workspace, 7 # Switch to workspace 7
bind = $mainMod, 8, workspace, 8 # Switch to workspace 8
bind = $mainMod, 9, workspace, 9 # Switch to workspace 9
bind = $mainMod, 0, workspace, 10 # Switch to workspace 10

# Category: Move active window to a workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1 # Move window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2 # Move window to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3 # Move window to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4 # Move window to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5 # Move window to workspace 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6 # Move window to workspace 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7 # Move window to workspace 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8 # Move window to workspace 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9 # Move window to workspace 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10 # Move window to workspace 10

# Category: Example special workspace (scratchpad)
bind = $mainMod CTRL, S, togglespecialworkspace, magic # Toggle special workspace (scratchpad)
bind = $mainMod SHIFT, S, movetoworkspace, special:magic # Move window to special workspace (scratchpad)

# Category: Scroll through existing workspaces
bind = $mainMod, mouse_down, workspace, e+1 # Scroll to next workspace
bind = $mainMod, mouse_up, workspace, e-1 # Scroll to previous workspace

# Category: Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow # Drag to move window
bindm = $mainMod, mouse:273, resizewindow # Drag to resize window

# Category: Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ # Raise volume
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- # Lower volume
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # Mute audio
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle # Mute microphone
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+ # Increase screen brightness
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%- # Decrease screen brightness

# Category: Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next # Next track
bindl = , XF86AudioPause, exec, playerctl play-pause # Play/pause
bindl = , XF86AudioPlay, exec, playerctl play-pause # Play/pause
bindl = , XF86AudioPrev, exec, playerctl previous # Previous track

# Category: Extra

bind = $mainMod SHIFT, F, fullscreen # Toggle fullscreen
bind = $mainMod CTRL, F, fullscreen, 1 # Toggle fake fullscreen

# Category: Cheatsheet
bind = $mainMod, K, exec, ~/.config/rofi/cheatsheet/cheatsheet.sh # Open keybind cheatsheet
