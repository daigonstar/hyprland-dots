# Category: Default programs
$mainMod = SUPER
$terminal = ghostty
$fileManager = thunar
$menu = ~/.config/rofi/launchers/launcher.sh
$wall = ~/.config/rofi/wallpaper/wallpaper.sh
$browser = flatpak run app.zen_browser.zen
$store = flatpak run io.github.kolunmi.Bazaar
$chat = discord


# Category: Application Launchers

bind = $mainMod, T, exec, $terminal
bind = $mainMod, A, exec, $store
bind = $mainMod, Q, killactive,
bind = $mainMod, B, exec, $browser
bind = $mainMod SHIFT, S, exec, uuctl
bind = $mainMod SHIFT, R, exec, hyprctl reload
#bind = $mainMod, C, exec, $chat
bind = $mainMod, W, exec, $wall
bind = $mainMod SHIFT, T, exec, twingate start
bind = $mainMod, S, exec, flatpak run dev.diegovsky.Riff
bind = $mainMod, O, exec, flatpak run md.obsidian.Obsidian
#bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, Z, exec, zeditor

# Category: Tools

bind = ALT, Tab, exec, hypr-alttab
bind = $mainMod, L, exec, loginctl lock-session #Lock screen
bind = $mainMod, N, exec, ~/.config/hypr/scripts/restart.sh all #Restart Waybar + swaync
bind = $mainMod SHIFT, N, exec, ~/.config/hypr/scripts/restart.sh waybar #Restart Waybar
bind = $mainMod, END, exit,
bind = $mainMod SHIFT, G, exec, ~/.config/hypr/scripts/gamemode.sh
bind = $mainMod CTRL, O, exec, ~/.config/hypr/scripts/ollama.sh
bind = $mainMod SHIFT, O, exec, ~/.config/hypr/scripts/stop_ollama.sh
bind = $mainMod SHIFT, C, exec, clipvault list | rofi -dmenu -display-columns 2 | clipvault get | wl-copy
bind = SUPER, F12, exec, hyprctl dispatch focusmonitor DP-1

# Category: Screenshot
bind = CONTROL ALT, S, exec, hyprshot -m window -o ~/Pictures/screenshots
bind = CONTROL SHIFT, S, exec, hyprshot -m region -o ~/Pictures/screenshots

# Category: Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Category: Resize windows
binde = $mainMod SHIFT, left, resizeactive,-50 0
binde = $mainMod SHIFT, right, resizeactive,50 0
binde = $mainMod SHIFT, up, resizeactive,0 -50
binde = $mainMod SHIFT, down, resizeactive,0 50

# Category: Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Category: Move active window to a workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Category: Example special workspace (scratchpad)
bind = $mainMod CTRL, S, exec, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Category: Scroll through existing workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Category: Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Category: Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Category: Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Category: Extra

bind = $mainMod SHIFT, F, fullscreen # whole full screen
bind = $mainMod CTRL, F, fullscreen, 1 # fake full screen
