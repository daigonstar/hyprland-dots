# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

#Applications
exec-once = [workspace 2 silent] com.discordapp.Discord
exec-once = com.nextcloud.desktopclient.nextcloud --background
exec-once = org.openrgb.OpenRGB --startminimized -p Ice.orp
exec-once = coolercontrol
exec-once = [workspace 5 silent] flatpak run org.remmina.Remmina -c /home/robb/.var/app/org.remmina.Remmina/data/remmina/home_rdp_fatalis_10-23-1-35.remmina
exec-once = io.github.pwr_solaar.solaar --startminimized
exec-once = com.bitwarden.desktop
#Theming
exec-once = hyprctl setcursor Future-cursors 24

#Deamons
exec-once = systemctl --user start hyprpolkitagent
exec-once = waybar
exec-once = nm-applet
exec-once = swaync
exec-once = swww-daemon
exec-once = hypridle
exec-once = wl-paste --watch clipvault store
