# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Ignore maximize requests from apps. You'll probably like this.
# windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
# Currently not working will work on fix ASAP

#windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

#Looks
# Refer to https://wiki.hyprland.org/Configuring/Variables/
# https://wiki.hyprland.org/Configuring/Variables/#general

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
   gaps_in = 5
   gaps_out = 10
   border_size = 2
   # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
   col.active_border = $color12
   col.inactive_border = $color10
   # Set to true enable resizing windows by clicking and dragging on borders and gaps
   resize_on_border = false
   # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
   allow_tearing = true
   layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration

decoration {
   rounding = 18
   rounding_power = 2

# Change transparency of focused and unfocused windows

   active_opacity = 1.0
   inactive_opacity = 1.0

   shadow {
        enabled = true
        enabled = true
        enabled = true
        enabled = true
        enabled = true
        enabled = true
        enabled = true
        enabled = true
        enabled = false
        enabled = false
       enabled = false
       range = 4
       render_power = 3
      color =  $color13
      color_inactive = $color10
   }

# https://wiki.hyprland.org/Configuring/Variables/#blur
   blur {
       enabled = true
       size = 3
       passes = 1
       vibrancy = 0.1696
   }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    # https://cubic-bezier.com/
    # https://easings.net
    # https://https://www.cssportal.com/css-cubic-bezier-generator/

    enabled = true
bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = linear, 1, 1, 1, 1
    bezier = Cubic, 0.1, 0.1, 0.1, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = ease-in-out, 0.17, 0.67, 0.83, 0.67
    bezier = ease-in, 0.17, 0.67, 0.83, 0.67
    bezier = ease-out, 0.42, 0, 1, 1
    bezier = easeInOutSine, 0.37, 0, 0.63, 1
    bezier = easeInSine, 0.12, 0, 0.39, 0
    bezier = easeOutSine, 0.61, 1, 0.88, 1

    animation = windowsIn, 1, 3, easeInOutSine, popin
    animation = windowsOut, 1, 3, easeInOutSine, popin

    animation = border, 1, 3, easeInOutSine
    animation = borderangle, 1, 30, easeInOutSine, loop

    animation = workspacesIn, 1, 3, easeInOutSine, slidefade
    animation = workspacesOut, 1, 3, easeInOutSine, slidefade

    animation = specialWorkspaceIn, 1, 3, easeInOutSine, slidevert
    animation = specialWorkspaceOut, 1, 3, easeInOutSine, slidevert

    animation = layersIn, 1, 3, easeInOutSine, fade
    animation = layersOut, 1, 3, easeInOutSine, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]
# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more

dwindle {
   # pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
   preserve_split = true # You probably want this
}
# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
   new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
   force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
   disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


# =========================================================
# HYPRLAND WINDOW RULES (MODERN v0.53+ SYNTAX)
# =========================================================

# -------------------------
# CHAT APPS
# -------------------------
windowrule {
    name = chat_workspace
    match:class = ^(discord|WebCord|[v]Vesktop)$
    workspace = 2
}

# -------------------------
# STEAM GAMES (FIX YOUR 1080p BUG)
# -------------------------

windowrule {
    name = steam_workspace
    match:class = ^steam_app_.*$
    workspace = 3
}

windowrule {
    name = steam_fullscreen
    match:class = ^steam_app_.*$
    fullscreen = true
}

windowrule {
    name = steam_immediate
    match:class = ^steam_app_.*$
    immediate = true
}

# -------------------------
# STEAM UI / LAUNCHERS
# -------------------------
windowrule {
    name = steam_ui
    match:class = ^steam$
    workspace = 1
}

windowrule {
    name = lutris
    match:title = ^Lutris$
    workspace = 1
}

windowrule {
    name = heroic
    match:class = ^com.heroicgameslauncher.hgl$
    workspace = 5
}

# -------------------------
# REMOTE DESKTOP
# -------------------------
windowrule {
    name = remmina
    match:class = ^Remmina$
    workspace = 4
    fullscreen = true
}

# -------------------------
# APPS ON WORKSPACES (SILENT)
# -------------------------

windowrule {
    name = discord_silent
    match:class = ^(discord)$
    workspace = 2 silent  # The 'silent' must be here
}

windowrule {
    name = bitwarden_silent
    match:class = ^(com.bitwarden.desktop)$
    workspace = 3 silent
}

windowrule {
    name = solaar_silent
    match:class = ^(solaar)$
    workspace = 5 silent
}
