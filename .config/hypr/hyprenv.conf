#Hyprland environment variables

#Cursor settings
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#Fixes#

# unscale XWayland
xwayland {
  force_zero_scaling = true
}

permission = /usr/bin/hypr-dock, screencopy, allow
permission = /usr/bin/hypr-alttab, screencopy, allow
env = WLR_DRM_DEVICES,/dev/dri/card0

#misc {
#    focus_on_activate = true
#    mouse_move_focuses_monitor = false
#}

env = SDL_VIDEO_FULLSCREEN_HEAD,0
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland

#Nvidia Specific (uncomment each item to use)
#env = LIBVA_DRIVER_NAME,nvidia
#env = __GLX_VENDOR_LIBRARY_NAME,nvidia
#env = ELECTRON_OZONE_PLATFORM_HINT,auto
#env = NVD_BACKEND,direct

#Dual Cards (Make sure to set the correct card for primary in Hyprland cpu card…)
#env = AQ_DRM_DEVICES,/dev/dri/card0:/dev/dri/card1

# Steam/Proton - fixes Proton games grabbing the wrong monitor's
# resolution/refresh rate under Wayland (native Wayland support in
# Proton, avoids the Xwayland "guess the primary output" bug). Applies
# session-wide so no per-game launch option (%command%) is needed.
env = PROTON_ENABLE_WAYLAND,1
